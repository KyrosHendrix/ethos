[workspace]
resolver = "2"
members = ["core", "engine", "src-tauri", "tools/create-icon", "ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
ethos-core = { path = "core" }
ethos-engine = { path = "engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = "debuginfo"
